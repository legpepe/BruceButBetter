[esp_general]
build_src_filter = ${env.build_src_filter} +<../boards/ESP-General>

build_flags =
    ${env.build_flags}
    -Iboards/ESP-General
    -DCORE_DEBUG_LEVEL=0
    -Os

    ; ── Устройство ────────────────────────────────────────────────────────────
    -DUSE_DIRECT_ROTATION=1
    -DFORCE_COLOR_NORMAL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSB_as_HID=1

    ; ── Экран OLED SSD1306 (Перевели I2C шину на боковые пины 8 и 9) ─────────
    -DGROVE_SDA=8
    -DGROVE_SCL=9

    -DHAS_SCREEN=1
    -DUSE_LOVYANGFX=1
    -DLOVYAN_BUS=Bus_I2C
    -DLOVYAN_I2C_BUS=1
    -DTFT_I2C_ADDR=0x3C
    -DTFT_RST=-1
    -DTFT_WIDTH=128
    -DTFT_HEIGHT=64
    -DTFT_MEM_HEIGHT=64
    -DTFT_OFFSET_Y=0
    -DTFT_INVERTION=0
    -DTFT_RGB_ORDER=0
    -DTFT_I2C_PORT=0
    -DTFT_I2C_WRITE=400000
    -DTFT_I2C_READ=400000
    -DTFT_SDA=8
    -DTFT_SCL=9
    -DTFT_ADDR=0x3C
    -DTFT_CS=-1
    -DTFT_BUSY_PIN=-1
    -DTFT_BL=-1
    -DBACKLIGHT=-1
    -DMINBRIGHT=0
    -DROTATION=2
    -DSMOOTH_FONT=0
    -DTFT_DISPON=0x29
    -DTFT_DISPOFF=0x28
    -DTFT_MONOCHROME=1
    -DUI_COMPACT=1

    ; ── Оптимизация интерфейса под OLED ───────────────────────────────────────
    -DSTATUS_BAR_HEIGHT=14
    -DBORDER_PAD_Y=14
    -DBORDER_PAD_X=8

    ; ── Общая шина SPI ────────────────────────────────────────────────────────
    -DSPI_MOSI_PIN=11
    -DSPI_SCK_PIN=12
    -DSPI_MISO_PIN=13
    -DSPI_SS_PIN=10

    ; ── CC1101 (Отключаем, так как ты его убираешь) ───────────────────────────
    -DCC1101_GDO0_PIN=-1
    -DCC1101_SS_PIN=-1

    ; ── MicroSD (Карта памяти, CS уводим на TX-пин) ───────────────────────────
    -DSDCARD_CS=43
    -DSDCARD_MOSI=11
    -DSDCARD_SCK=12
    -DSDCARD_MISO=13

    ; ── Твоё радио nRF24L01 (Все пины на боковых ножках) ──────────────────────
    -DNRF24_CE_PIN=14
    -DNRF24_SS_PIN=10
    -DNRF24_MOSI_PIN=11
    -DNRF24_SCK_PIN=12
    -DNRF24_MISO_PIN=13

    ; ── Твой ИК-Порт (RX на GPIO1, TX на GPIO2 — боковые!) ───────────────────
    -DRXLED=1
    -DTXLED=2
    -DLED_ON=HIGH
    -DLED_OFF=LOW
    -DIR_TX_PINS='{{"IR TX", 2}}'
    -DIR_RX_PINS='{{"IR RX", 1}}'

    -DRF_TX_PINS='{{"RF TX", 2}}'
    -DRF_RX_PINS='{{"RF RX", 1}}'
    -DBUZZ_PIN=-1

    ; ── Кнопки управления (ВСЕ 6 ШТУК НА БОКОВЫХ ПИНАХ!) ──────────────────────
    -DSEL_BTN=7    ; OK
    -DUP_BTN=3     ; ВВЕРХ
    -DDW_BTN=4     ; ВНИЗ
    -DL_BTN=5      ; ВЛЕВО
    -DR_BTN=6      ; ВПРАВО
    -DESC_BTN=0    ; НАЗАД (кнопка Boot на плате)
    -DBTN_ACT=LOW

    ; ── Отключаем тяжелые модули ──────────────────────────────────────────────
    -DDISABLE_LORA
    -DDISABLE_GPS
    -DDISABLE_ETHERNET
    -DDISABLE_FM

    -DSERIAL_TX=43
    -DSERIAL_RX=44

lib_deps =
    ${env.lib_deps}
    etherkit/Etherkit Si5351@^2.1.4
    lovyan03/LovyanGFX@^1.2.0

lib_ignore =
    TFT_eSPI


; ──────────────────────────────────────────────────────────────────────────────
; НАША СБОРКА: Спецификация под твою ESP32-S3 Super Mini с OLED SSD1306 (4MB Flash)
; Скомпилирует точный 4-мегабайтный файл под твою плату
; ──────────────────────────────────────────────────────────────────────────────
[env:esp32-s3-devkitc-1-psram-ssd1306]
board_build.arduino.memory_type = qio_qspi   ; Сменили тип ОЗУ под 2MB PSRAM на Super Mini
board_build.partitions          = default_4MB.csv  ; Сжали разметку памяти до 4 Мегабайт
board_upload.flash_size         = 4MB
board_upload.maximum_size       = 4194304

board = ESP-General

build_src_filter = ${esp_general.build_src_filter}
build_flags      = ${esp_general.build_flags}
    -DLOVYAN_PANEL=Panel_SSD1306
    -DTFT_MEM_WIDTH=128
    -DTFT_OFFSET_X=0
lib_deps         = ${esp_general.lib_deps}
lib_ignore       = ${esp_general.lib_ignore}
